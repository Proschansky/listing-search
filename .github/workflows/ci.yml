# Continuous integration: every push and pull request runs the same gate as
# the pre-push hook (`make ci`), split into parallel jobs so failures are
# quick to find:
#
#   backend   ruff, ruff format, mypy, pytest with a 95% coverage gate
#   frontend  oxlint (incl. jsx-a11y), prettier, tsc, vitest with 95% gates
#   e2e       Playwright against the real stack, desktop + mobile; runs only
#             once both halves pass
#   audit     dependency vulnerability report (runtime deps). Report-only:
#             high/critical findings appear as WARNING annotations on the run
#             and PR but never fail CI, because a vulnerability with no fix
#             released yet would otherwise block every build. Blocking happens
#             locally, in the pre-push hook, and only when a fix exists.
#   docker    builds both images, so a broken Dockerfile can't merge
#
# Make "backend", "frontend" and "e2e" required status checks on main
# (Settings -> Branches) so nothing merges red.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Lint and type-check
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check . && .venv/bin/mypy
      - name: Test with coverage gate
        run: .venv/bin/pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/coverage.xml }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Lint, format and type-check
        run: npm run lint && npm run format:check && npm run typecheck
      - name: Unit, component and accessibility tests with coverage gates
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: frontend-coverage, path: frontend/coverage }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: npm ci --no-fund --no-audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright end-to-end tests
        run: npm run test:e2e
        working-directory: frontend
        env: { CI: "true" }
      # On failure, the HTML report holds traces, screenshots and videos.
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install pip-audit
      - name: Vulnerability report (runtime dependencies, warnings only)
        run: backend/.venv/bin/python scripts/check_vulns.py --report-only
      - name: Gate's own tests
        run: backend/.venv/bin/pip install pytest pytest-cov && make test-scripts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t listing-search-api backend
      - run: docker build -t listing-search-web frontend
