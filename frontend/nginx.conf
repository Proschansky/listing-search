# nginx config for the production frontend container.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Gzip text assets; JS bundles shrink by ~70%.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hardening headers for the HTML app. The CSP allows only our own
    # assets, plus OpenStreetMap tiles for the map view.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    # Container health check (no backend involved).
    location = /healthz { return 200 "ok\n"; }

    # The API: forwarded to the backend service from docker-compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;  # trace ID starts at the edge
    }

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths get index.html (never cached, so a new
    # deploy is picked up on the next load).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
