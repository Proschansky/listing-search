# Run the whole stack in containers:   docker compose up --build
# Then open http://localhost:8080   (API docs are off in production mode).
#
# `web` waits until the API's readiness probe passes before starting, so the
# UI never comes up in front of an API that can't serve searches yet.
services:
  api:
    build: ./backend
    # "- KEY=value" form, so Compose keeps every value a plain string (the
    # map form would turn a substituted '["sample"]' into a YAML list).
    environment:
      - LISTING_ENVIRONMENT=production
      - LISTING_LOG_FORMAT=json
      # Sample data plus the SimplyRETS live feed, unless the host sets
      # LISTING_SOURCES (for example LISTING_SOURCES='["sample"]' to go offline).
      - LISTING_SOURCES=${LISTING_SOURCES:-["sample","simplyrets"]}
      # /srv belongs to root in the image; the API runs as the "app" user, so
      # the SimplyRETS snapshot goes in that user's home directory.
      - LISTING_SIMPLYRETS_CACHE_PATH=/home/app/.cache/simplyrets.json
      - LISTING_RATE_LIMIT_PER_MINUTE=120
    # Not published to the host: only reachable through the web proxy.
    expose: ["8000"]
    restart: unless-stopped

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
